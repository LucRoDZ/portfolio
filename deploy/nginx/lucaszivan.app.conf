# Shared-proxy mode: server blocks for an nginx container that already owns ports 80/443
# (e.g. the EASY.Q stack, which uses nginx + certbot webroot certificates).
#
# 1. Set SHARED_PROXY_NETWORK in the portfolio's .env to that nginx's Docker network
#    (`docker inspect <nginx container> -f '{{json .NetworkSettings.Networks}}'`).
# 2. Add this file to that nginx's config directory and reload it. See README → "Shared-proxy mode".
# The resolver + variable make nginx start even while the portfolio container is down,
# and re-resolve it after each deploy.

server {
    listen 80;
    server_name lucaszivan.app www.lucaszivan.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://lucaszivan.app$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.lucaszivan.app;

    ssl_certificate     /etc/letsencrypt/live/lucaszivan.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lucaszivan.app/privkey.pem;

    return 301 https://lucaszivan.app$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name lucaszivan.app;

    ssl_certificate     /etc/letsencrypt/live/lucaszivan.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lucaszivan.app/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $portfolio http://lucaszivan-portfolio-app:3000;

    # Security headers come from the app; long cache for content-hashed assets.
    location /_next/static/ {
        proxy_pass $portfolio;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass         $portfolio;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_timeout 10s;
    }
}
